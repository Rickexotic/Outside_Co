<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Presentación</title>

    <link
        id="presentationStyles"
        rel="stylesheet"
        href="styles.css?v=11">

</head>

<body>

    <div class="progress-container">

        <div id="progressBar"
            class="progress-bar">
        </div>

    </div>

    <nav class="side-nav" aria-label="Presentation navigation">

        <button id="goTop" class="presentation-jump" type="button" aria-label="Ir al inicio" title="Ir al inicio" disabled>
            <svg aria-hidden="true" width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 3h12M3 11l5-5 5 5"/>
            </svg>
        </button>

        <button id="goBottom" class="presentation-jump" type="button" aria-label="Ir al final" title="Ir al final">
            <svg aria-hidden="true" width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 5l5 5 5-5M2 13h12"/>
            </svg>
        </button>

    </nav>

    <!-- Todo el contenido (marca, tema y slides) se genera desde data/content.json -->

    <main id="main">

        <section id="intro" class="slide intro-slide">

            <button
                id="themeToggle"
                class="theme-btn"
                type="button"
                aria-label="Cambiar tema">
                <svg
                    aria-hidden="true"
                    xmlns="http://www.w3.org/2000/svg"
                    width="18"
                    height="18"
                    fill="currentColor"
                    viewBox="0 0 16 16">
                    <path d="M8 15A7 7 0 1 0 8 1zm0 1A8 8 0 1 1 8 0a8 8 0 0 1 0 16"/>
                </svg>
            </button>

            <div class="intro-stage">

                <div class="intro-search" aria-hidden="true">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <circle cx="11" cy="11" r="7"/>
                        <path d="M20 20l-3.5-3.5"/>
                    </svg>
                    <span class="intro-query"><span id="introTyped"></span><span class="intro-caret"></span></span>
                    <span id="introAction" class="intro-search-action">Buscar</span>
                </div>

                <img
                    id="outsideLogo"
                    class="intro-logo"
                    alt="">

            </div>

            <audio id="introSound" preload="auto" loop></audio>
            <button id="replayIntro" class="intro-replay" type="button" aria-label="Reproducir introducción con sonido" title="Reproducir introducción con sonido" hidden>
                <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M11.536 14.01A8.47 8.47 0 0 0 14.026 8a8.47 8.47 0 0 0-2.49-6.01l-.708.707A7.48 7.48 0 0 1 13.025 8c0 2.071-.84 3.946-2.197 5.303z"/>
                    <path d="M10.121 12.596A6.48 6.48 0 0 0 12.025 8a6.48 6.48 0 0 0-1.904-4.596l-.707.707A5.48 5.48 0 0 1 11.025 8a5.48 5.48 0 0 1-1.61 3.89z"/>
                    <path d="M10.025 8a4.5 4.5 0 0 1-1.318 3.182L8 10.475A3.5 3.5 0 0 0 9.025 8c0-.966-.392-1.841-1.025-2.475l.707-.707A4.5 4.5 0 0 1 10.025 8M7 4a.5.5 0 0 0-.812-.39L3.825 5.5H1.5A.5.5 0 0 0 1 6v4a.5.5 0 0 0 .5.5h2.325l2.363 1.89A.5.5 0 0 0 7 12zM4.312 6.39 6 5.04v5.92L4.312 9.61A.5.5 0 0 0 4 9.5H2v-3h2a.5.5 0 0 0 .312-.11"/>
                </svg>
            </button>

        </section>

    </main>

    <script id="presentationScript" src="app.js?v=10"></script>

</body>

</html>
